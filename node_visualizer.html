<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RaveBox Node Visualizer</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; width: 100%; height: 100%; }
        #status {
            position: fixed; bottom: 10px; left: 10px;
            color: rgba(255,255,255,0.3); font-family: monospace; font-size: 10px;
            pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="status">Connecting...</div>
    <canvas id="gl-canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

    <script>
        const canvas = document.getElementById('gl-canvas');
        const statusEl = document.getElementById('status');
        
        // --- 1. SHADERS ---
        const VERTEX_SHADER = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const DEFAULT_FRAGMENT_SHADER = `
            precision highp float;
            varying vec2 vUv;
            uniform float u_time;
            uniform float u_clock;
            uniform float u_bass;
            uniform vec2 u_resolution;
            uniform sampler2D u_image;
            void main() {
                vec2 uv = vUv - 0.5;
                uv.x *= u_resolution.x / u_resolution.y;
                float radius = length(uv);
                float angle = atan(uv.y, uv.x) + u_clock * 0.2;
                vec2 polarUv = vec2(cos(angle), sin(angle)) * radius * (0.8 - u_bass * 0.2);
                vec3 color = texture2D(u_image, fract(polarUv + 0.5)).rgb;
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // --- 2. ENGINE STATE ---
        let renderer, scene, camera, baseMesh, fxMesh;
        let uniforms = {
            u_time: { value: 0 },
            u_clock: { value: 0 },
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            u_bass: { value: 0 }, u_flux: { value: 0 }, u_high: { value: 0 }, u_vol: { value: 0 },
            u_beat_phase: { value: 0 }, u_beat_pulse: { value: 0 },
            u_dual: { value: 0.0 },
            u_image: { value: new THREE.Texture() },
            u_image2: { value: new THREE.Texture() },
            u_strobe: { value: 0 }, u_blackout: { value: 0 },
            u_spin: { value: 0 }, u_spin_angle: { value: 0 },
            u_zoom: { value: 1.0 }, u_hue: { value: 0 }, u_invert: { value: 0 }
        };

        let library = [];
        let lastBase = -1, lastFx = -1;

        // --- 3. CORE LOGIC ---
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);

            const baseMat = new THREE.ShaderMaterial({ 
                vertexShader: VERTEX_SHADER, 
                fragmentShader: DEFAULT_FRAGMENT_SHADER, 
                uniforms: uniforms 
            });
            baseMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), baseMat);
            scene.add(baseMesh);

            const fxMat = new THREE.ShaderMaterial({ 
                vertexShader: VERTEX_SHADER, 
                fragmentShader: DEFAULT_FRAGMENT_SHADER, 
                uniforms: uniforms,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            });
            fxMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fxMat);
            fxMesh.visible = false;
            scene.add(fxMesh);

            animate();
            connect();
            fetchLibrary();
        }

        function animate() {
            requestAnimationFrame(animate);
            uniforms.u_time.value += 0.01;
            renderer.render(scene, camera);
        }

        async function fetchLibrary() {
            try {
                const [imgRes, aiRes, aiResOld] = await Promise.all([
                    fetch('/api/images/list'),
                    fetch('/api/usergen2/list'),
                    fetch('/api/usergen/list')
                ]);
                const imgs = await imgRes.json();
                const ais = await aiRes.json();
                const aisOld = await aiResOld.json();

                library = [
                    ...imgs.map(i => ({ ...i, category: 'tex' })),
                    ...ais.map(a => ({ ...a, category: a.type || 'base', path: 'library2' })),
                    ...aisOld.map(a => ({ ...a, category: a.type || 'base', path: 'library' }))
                ];
                library.sort((a, b) => b.mtime - a.mtime);
                console.log("📚 Library Loaded:", library.length);
            } catch (e) { console.error("Library load failed:", e); }
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsHost = window.location.hostname;
            // The engine port is 8765
            const wsUrl = `${protocol}//ws-${wsHost}`; 
            
            // If on localhost or direct IP, try standard port
            const socket = new WebSocket(wsUrl.includes('ravebox.love') ? wsUrl : `${protocol}//${wsHost}:8765`);
            socket.binaryType = 'arraybuffer';

            socket.onopen = () => { statusEl.innerText = "STANDALONE NODE ACTIVE"; statusEl.style.color = "#0f0"; };
            socket.onclose = () => { statusEl.innerText = "Disconnected. Retrying..."; setTimeout(connect, 2000); };

            socket.onmessage = async (event) => {
                if (event.data instanceof ArrayBuffer) {
                    const view = new DataView(event.data);
                    
                    // Decode Binary Mods (Matches main.py V3 format)
                    uniforms.u_clock.value = view.getFloat32(0, true);
                    uniforms.u_flux.value = view.getFloat32(4, true);
                    uniforms.u_bass.value = view.getFloat32(8, true);
                    uniforms.u_high.value = view.getFloat32(16, true);
                    uniforms.u_vol.value = view.getFloat32(20, true);
                    uniforms.u_beat_phase.value = view.getFloat32(28, true);
                    uniforms.u_beat_pulse.value = view.getFloat32(32, true) || 0;

                    const baseIdx = view.getUint16(80, true);
                    const fxIdx = view.getUint16(82, true);

                    // Auto-Switch Logic
                    if (baseIdx !== lastBase && library.length > 0) {
                        lastBase = baseIdx;
                        const bases = library.filter(i => i.category === 'base' || i.category === 'tex');
                        if (bases.length > 0) {
                            const item = bases[baseIdx % bases.length];
                            applyItem(item, 'base');
                        }
                    }
                    if (fxIdx !== lastFx && library.length > 0) {
                        lastFx = fxIdx;
                        const fxs = library.filter(i => i.category === 'fx');
                        if (fxs.length > 0) {
                            applyItem(fxs[fxIdx % fxs.length], 'fx');
                        } else {
                            fxMesh.visible = false;
                        }
                    }
                } else {
                    const msg = JSON.parse(event.data);
                    if (msg.type === "state" && msg.visual_commands) {
                        // Handle Visual Overrides
                        const zoom = msg.visual_commands.find(c => c.function === 'zoom');
                        if (zoom) uniforms.u_zoom.value = parseFloat(zoom.value);
                    }
                }
            };
        }

        async function applyItem(item, type) {
            if (item.category === 'tex') {
                new THREE.TextureLoader().load(`/${item.file}`, (tex) => {
                    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                    uniforms.u_image.value = tex;
                    // Reset to default kaleido for images
                    baseMesh.material.fragmentShader = DEFAULT_FRAGMENT_SHADER;
                    baseMesh.material.needsUpdate = true;
                });
            } else {
                const path = item.path || 'library2';
                const res = await fetch(`/${path}/${item.file}`);
                const code = await res.text();
                const mesh = (type === 'base') ? baseMesh : fxMesh;
                mesh.material.fragmentShader = code;
                mesh.material.needsUpdate = true;
                mesh.visible = true;
            }
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
