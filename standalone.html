<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RaveBox Visualizer - Standalone Demo</title>
    <style>
        :root {
            --bg: #050508;
            --accent: #9d7cff;
            --text: #ffffff;
            --panel: rgba(20, 20, 27, 0.6);
            --border: rgba(255, 255, 255, 0.12);
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overscroll-behavior: none;
            touch-action: pan-y;
        }
        iframe {
            width: 100vw;
            height: 100dvh;
            border: none;
        }

    </style>
    <script src="standalone_engine.js"></script>
</head>
<body>
    <iframe id="viz-frame" src="standalone_viz.html"></iframe>
    <script>
        window.addEventListener('load', () => {
            if (typeof startStandaloneEngine === 'function') {
                startStandaloneEngine();
            }
        });
    </script>
</body>
</html>
