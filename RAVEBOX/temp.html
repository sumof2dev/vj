<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaveBox Control</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #05050d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
            display: inline-block;
        }

        .background-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Base button styling */
        .nav-button {
            position: absolute;
            text-decoration: none;
            font-weight: bold;
            font-size: clamp(14px, 2.5vw, 22px);
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.3s ease;
            transform: translate(-50%, -50%);
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid transparent;
        }

        /* Visualizer Button (Pink theme) */
        .btn-visualizer {
            top: 51%;
            left: 28%;
            color: #ff00ff;
            background-color: rgba(255, 0, 255, 0.1);
            border-color: rgba(255, 0, 255, 0.4);
            text-shadow: 0 0 8px rgba(255, 0, 255, 0.6);
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
        }

        .btn-visualizer:hover {
            background-color: rgba(255, 0, 255, 0.3);
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
        }

        /* Connect Button (Green theme) */
        .btn-connect {
            top: 47%;
            left: 76%;
            color: #00ff66;
            background-color: rgba(0, 255, 102, 0.1);
            border-color: rgba(0, 255, 102, 0.4);
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .btn-connect:hover {
            background-color: rgba(0, 255, 102, 0.3);
            border-color: #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }

        /* Learn More Button (White/Silver theme) */
        .btn-learn-more {
            top: 88%;
            left: 60%;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .btn-learn-more:hover {
            background-color: rgba(255, 255, 255, 0.25);
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>

    <div class="container">
        <img src="index.png" alt="RaveBox Background" class="background-image">

        <a href="standalone.html" class="nav-button btn-visualizer">Visualizer</a>
        <a href="https://example.com/connect" class="nav-button btn-connect">Connect</a>
        <a href="learnmore.html" class="nav-button btn-learn-more">Learn More</a>
    </div>

</body>

</html>
