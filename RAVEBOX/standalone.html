<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaveBox Visualizer - Standalone Demo</title>
    <style>
        :root {
            --bg: #050508;
            --accent: #9d7cff;
            --text: #ffffff;
            --panel: rgba(20, 20, 27, 0.4);
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overscroll-behavior: none;
            touch-action: none;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            border: none;
            display: block;
        }

        #source-selector {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            width: 280px;
            background: var(--panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .brand {
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            font-size: 1.4rem;
            margin-bottom: 8px;
        }
        .brand span { color: var(--accent); }

        .btn {
            background: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-1px);
        }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }
        .btn-primary:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 20px rgba(157, 124, 255, 0.4);
        }

    </style>
    <script src="standalone_engine.js"></script>
</head>
<body>
    <iframe id="viz-frame" src="standalone_viz.html" allow="autoplay; microphone; display-capture"></iframe>

    <div id="source-selector">
        <div class="brand">RAVE<span>BOX</span></div>
        <div style="font-size: 11px; opacity: 0.5; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;">Standalone Visualizer</div>
        
        <button class="btn btn-primary" onclick="startStandaloneEngine()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
            Microphone Input
        </button>

        <button id="btn-system" class="btn" onclick="setSystemAudio()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="15" x="2" y="3" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            System / Tab Audio
        </button>

        <button id="btn-spotify" class="btn" onclick="window.location.href='index.html?show=ad&source=spotify'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 12a4 4 0 0 1 8 0"></path><path d="M9 15a3 3 0 0 1 6 0"></path></svg>
            Spotify / Device Audio
        </button>
    </div>

    <script>
        // Source selector is visible by default. 
        // engine_standalone.js will hide it once audio is initialized via setupAudioStream().
        
        // Mobile browsers generally don't support getDisplayMedia audio sharing.
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            const btn = document.getElementById('btn-system');
            if (btn) btn.style.display = 'none';
        }
    </script>
</body>

</html>
