<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaveBox Control</title>
    <meta name="description"
        content="Connect and control your RaveBox hardware, access the music visualizer, and manage audio-reactive DMX lighting setups.">

    <!-- Google Fonts for modern premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <script type="text/javascript">
        // Direct auto-redirect for existing paid users
        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('disconnect') === 'true') {
                localStorage.removeItem('vj_backend_host');
                window.history.replaceState({}, '', window.location.pathname);
            }

            const savedHost = localStorage.getItem('vj_backend_host');
            if (savedHost) {
                if (savedHost.includes('.') || savedHost.includes(':') || savedHost === 'localhost') {
                    let target = savedHost;
                    if (!target.startsWith('http://') && !target.startsWith('https://')) {
                        target = 'http://' + target;
                    }
                    if (!target.includes(':', 6)) {
                        target = target + ':8000';
                    }
                    window.location.href = target.replace(/\/+$/, '') + '/manager.html';
                } else {
                    window.location.href = `https://${savedHost}.ravebox.love/manager.html`;
                }
            }
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #05050d;
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            overscroll-behavior: none;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
            display: inline-block;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .background-image {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
            animation: subtle-zoom 20s infinite ease-in-out;
        }

        @keyframes subtle-zoom {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        /* Base button styling */
        .nav-button {
            position: absolute;
            text-decoration: none;
            font-weight: 800;
            font-size: clamp(14px, 2.5vw, 22px);
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(-50%, -50%);
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid transparent;
        }

        /* Visualizer Button (Pink theme) */
        .btn-visualizer {
            top: 51%;
            left: 28%;
            color: #ff00ff;
            background-color: rgba(255, 0, 255, 0.1);
            border-color: rgba(255, 0, 255, 0.4);
            text-shadow: 0 0 8px rgba(255, 0, 255, 0.6);
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
        }

        .btn-visualizer:hover {
            background-color: rgba(255, 0, 255, 0.3);
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
            transform: translate(-50%, -50%) scale(1.05);
        }

        /* Connect Button (Green theme) */
        .btn-connect {
            top: 47%;
            left: 76%;
            color: #00ff66;
            background-color: rgba(0, 255, 102, 0.1);
            border-color: rgba(0, 255, 102, 0.4);
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .btn-connect:hover {
            background-color: rgba(0, 255, 102, 0.3);
            border-color: #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
            transform: translate(-50%, -50%) scale(1.05);
        }

        /* Learn More Button (White/Silver theme) */
        .btn-learn-more {
            top: 88%;
            left: 60%;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .btn-learn-more:hover {
            background-color: rgba(255, 255, 255, 0.25);
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%) scale(1.05);
        }

        /* Connect Modal Styling with Premium Glassmorphism */
        :root {
            --primary: #00f2ff;
            --secondary: #ff00ff;
            --success: #00ff66;
            --text-dim: #a0a0b0;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 8, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .pair-modal {
            background: rgba(13, 13, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            text-align: left;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05),
                0 0 50px rgba(255, 0, 255, 0.1);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .pair-modal {
            transform: scale(1);
        }

        .pair-modal h2 {
            margin: 0 0 0.75rem 0;
            font-size: 1.5rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .pair-modal p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .pair-modal input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
            font-family: inherit;
        }

        .pair-modal input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2), 0 0 15px rgba(0, 242, 255, 0.2);
        }

        .action-btns {
            display: flex;
            gap: 12px;
        }

        .btn {
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            font-family: inherit;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
            flex: 1;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-save {
            background: linear-gradient(45deg, var(--primary), #00ff66);
            color: #05050d;
            flex: 1;
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.3);
        }

        .btn-save:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 242, 255, 0.4);
            filter: brightness(1.1);
        }

        .btn-save:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1
            style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;">
            RaveBox Control Center</h1>
        <img src="/public/index.png" alt="RaveBox Background" class="background-image">

        <a href="standalone.html" class="nav-button btn-visualizer">Visualizer</a>
        <a href="javascript:void(0)" onclick="openConnectModal()" class="nav-button btn-connect">Connect</a>
        <a href="learnmore.html" class="nav-button btn-learn-more">Learn More</a>
    </div>

    <!-- Connect Device Modal -->
    <div id="connectModal" class="modal-overlay">
        <div class="pair-modal">
            <h2>Connect RaveBox</h2>
            <p>Enter your RaveBox Secret Code or Backend IP Address to load your control dashboard.</p>

            <input type="text" id="backendHostInput" placeholder="e.g. mybox or 192.168.1.100" spellcheck="false"
                autocomplete="off">

            <div class="action-btns">
                <button class="btn btn-cancel" onclick="closeConnectModal()">Cancel</button>
                <button class="btn btn-save" onclick="saveBackendConnection()">Connect</button>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        // Connect Modal Handlers
        function openConnectModal() {
            const modal = document.getElementById('connectModal');
            modal.classList.add('active');
            setTimeout(() => {
                document.getElementById('backendHostInput').focus();
            }, 50);
        }

        function closeConnectModal() {
            document.getElementById('connectModal').classList.remove('active');
        }

        // Connect/disconnect host
        function saveBackendConnection() {
            const val = document.getElementById('backendHostInput').value.trim();
            if (val === '') {
                alert("Please enter a valid Secret Code or IP Address.");
                return;
            }

            localStorage.setItem('vj_backend_host', val);
            closeConnectModal();

            if (val.includes('.') || val.includes(':') || val === 'localhost') {
                let target = val;
                if (!target.startsWith('http://') && !target.startsWith('https://')) {
                    target = 'http://' + target;
                }
                if (!target.includes(':', 6)) {
                    target = target + ':8000';
                }
                window.location.href = target.replace(/\/+$/, '') + '/manager.html';
            } else {
                window.location.href = `https://${val}.ravebox.love/manager.html`;
            }
        }

        // Add event listener for Enter key in input
        document.getElementById('backendHostInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                saveBackendConnection();
            }
        });
    </script>
</body>

</html>
