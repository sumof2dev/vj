<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RaveBox | Profile Strategy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="setup.css?v=strategy_v5">
    <style>
        :root {
            --bg: #09090b;
            --card: #18181b;
            --accent: #818cf8;
            --accent-glow: rgba(129, 140, 248, 0.2);
            --chill: #2dd4bf;
            --mid: #0ea5e9;
            --high: #8b5cf6;
            --text: #f4f4f5;
            --text-dim: #a1a1aa;
        }

        /* Override sidebar styles for dark theme consistency */
        .sidebar { background: #111 !important; }
        .main { background: var(--bg) !important; padding: 20px !important; }

        .channel-card {
            background: var(--card);
            border: 1px solid #27272a;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 40px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .channel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #27272a;
            padding-bottom: 16px;
        }

        .channel-title {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        /* --- Logic Selector --- */
        .logic-selector {
            width: 100%;
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 12px;
            color: var(--text);
            padding: 12px 16px;
            font-size: 14px;
            appearance: none;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            margin-bottom: 20px;
        }

        /* --- Proportion Slider --- */
        .proportion-container {
            height: 54px;
            background: #09090b;
            border-radius: 14px;
            position: relative;
            display: flex;
            overflow: hidden;
            margin-bottom: 8px;
            border: 1px solid #27272a;
        }

        .vibe-segment {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: rgba(255,255,255,0.9);
            transition: width 0.05s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .chill-seg { background: var(--chill); }
        .mid-seg { background: var(--mid); }
        .high-seg { background: var(--high); }

        .handle {
            position: absolute;
            top: 0; bottom: 0; width: 12px; background: #fff;
            cursor: ew-resize; z-index: 10; border-radius: 2px;
        }

        .percentage-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-dim);
            padding: 4px 8px 20px 8px;
        }

        /* --- Ranges --- */
        .range-item {
            display: flex; align-items: center; background: #09090b;
            border-radius: 12px; padding: 12px 16px; gap: 16px; border: 1px solid #27272a; margin-bottom: 8px;
        }

        .range-bounds { font-family: monospace; font-size: 13px; color: var(--accent); flex: 1; }
        .range-label { font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; }

        .btn-ghost {
            background: transparent; border: 1px dashed #3f3f46; border-radius: 12px;
            color: var(--text-dim); padding: 10px; cursor: pointer; font-size: 12px; width: 100%; margin-bottom: 24px;
        }

        /* --- Controls --- */
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding-top: 20px; border-top: 1px solid #27272a; }
        .control-group label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase; font-weight: 700; }
        .slider-custom { width: 100%; accent-color: var(--accent); }

        /* --- Global Actions Bar --- */
        .global-actions {
            position: sticky; top: 0; z-index: 50; margin-bottom: 30px;
            display: flex; gap: 12px; background: #111; padding: 16px;
            border-radius: 16px; border: 1px solid var(--accent);
        }

        .btn-primary {
            flex: 1; background: var(--accent); color: #fff; border: none; padding: 14px;
            border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-secondary {
            flex: 1; background: #27272a; color: var(--text); border: 1px solid #3f3f46; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <div class="brand">RAVE<span>BOX</span></div>
                <div class="subtitle">STRATEGY</div>
            </div>
        </div>
        <div class="nav-btn" onclick="window.location.href='setup.html?tab=stage'">
            <span class="nav-text">Dashboard</span>
        </div>
        <div class="nav-btn active">
            <span class="nav-text">Profile Editor</span>
        </div>
        <div class="nav-btn" onclick="window.location.href='manager.html'">
            <span class="nav-text">Home</span>
        </div>
    </div>

    <div class="main">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h1 style="font-family:'Outfit'; font-size:24px; margin:0;">Profile Editor</h1>
                <div id="profileNameDisplay" style="color:var(--text-dim); font-size:14px;">Loading...</div>
            </div>
            <button class="btn-ghost" style="width: auto; padding: 10px 20px; margin: 0;" onclick="addChannel()">+ New Channel</button>
        </header>

        <div class="global-actions">
            <button class="btn-primary" onclick="handleSaveClick()">
                <span>󰆓</span> Save to Server
            </button>
            <button class="btn-secondary" onclick="downloadProfile()">
                <span>󰉉</span> Download JSON
            </button>
        </div>

        <div id="channelList">
            <!-- Channel Cards Rendered Here -->
        </div>
    </div>

    <script src="shared_setup.js"></script>
    <script src="profilesetup_logic.js?v=strategy_v5"></script>
</body>
</html>
