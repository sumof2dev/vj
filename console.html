<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Console - RaveBox</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="setup.css">
    <link rel="stylesheet" href="engine_tab.css">
    <style>
        :root {
            --bg: #0a0a0c;
            --surface: #16161a;
            --primary: #00f2ff;
            --secondary: #7000ff;
            --success: #00ff88;
            --error: #ff3366;
            --text: #ffffff;
            --text-dim: #a0a0b0;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('/public/background.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Safe centering pattern */
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            overscroll-behavior: none;
            touch-action: pan-y;
            transition: background-image 1s ease-in-out;
        }

        .console-container {
            background: rgba(22, 22, 26, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            width: 100%;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            max-width: 350px; /* Default small */
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            margin: auto 0; /* Vertically center when space allows, start at top when overflowing */
        }

        .console-header {
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .console-header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #live-console-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }



        /* Mobile Adjustments */
        @media (max-width: 600px) {
            body {
                padding: 10px !important;
                overflow-y: auto !important;
                height: auto !important;
                min-height: 100dvh;
            }
            .console-container {
                border-radius: 20px;
                max-height: calc(100dvh - 30px);
                width: 100% !important;
                max-width: none !important;
                margin: 0 0 calc(40px + env(safe-area-inset-bottom, 0px)) 0 !important; /* Force start at top on mobile */
                transition: none !important; /* Disable jumpy transitions on mobile */
            }
            #live-console-grid {
                gap: 8px;
                padding: 12px;
            }
            .engine-accordion summary {
                height: 30px !important;
                min-height: 30px !important;
            }
            .engine-accordion summary div {
                width: 40px !important;
                height: 4px !important;
                opacity: 0.3;
            }
        }
        /* Console Header HUD Overrides */
        .console-header .universal-hud {
            position: relative !important;
            top: 0 !important;
            background: none !important;
            backdrop-filter: none !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 !important;
            display: flex !important;
            align-items: center !important;
            overflow: hidden !important;
        }
        .console-header .hud-presets {
            border: none !important;
            padding: 0 !important;
            margin: 0 !important;
            font-size: 11px !important;
            color: var(--primary) !important;
            font-weight: 800 !important;
        }
        .console-header .hud-vibe-log {
            border: none !important;
            padding: 0 !important;
            margin: 0 !important;
            font-size: 10px !important;
            color: var(--text-dim) !important;
            max-width: 150px !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }

        /* Mini EQ */
        .mini-eq {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 20px;
            padding: 2px 4px;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .eq-bar {
            width: 3px;
            height: 2px;
            background: var(--primary);
            border-radius: 1px;
            transition: height 0.1s ease-out;
            min-height: 2px;
        }
        
        /* Clean Divider Accordion */
        .engine-accordion summary::after {
            display: none !important;
        }
        .engine-accordion summary {
            outline: none;
        }
        
        /* Ensure container fits even if not mobile but small screen */
        .console-container {
            max-height: 90dvh;
        }
    </style>
</head>
<body class="theme-glass" style="flex-direction: column; padding: 20px;">
    <!-- LOADING OVERLAY -->
    <div id="loading-overlay">
        <div class="loader-logo">RAVE<span>BOX</span></div>
        <div class="loader-spinner-wrap">
            <div class="loader-spinner"></div>
            <div class="loader-spinner-inner"></div>
        </div>
    </div>

    <div class="console-container" id="console-main-container">
        <!-- CONDENSED TIMELINE AT THE TOP (COLLAPSIBLE) -->

            <summary style="height: 10px; min-height: 10px; padding: 0; cursor:pointer; list-style:none; display:flex; justify-content:center; align-items:center; background: rgba(255,255,255,0.02);">
                <div style="width: 30px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 1px;"></div>
            </summary>
            <div id="console-timeline-container" style="display: flex; flex-direction: column; background: rgba(0,0,0,0.3); overflow: hidden;">

                    <div style="flex: 1; position: relative; height: 100%;">
                        <canvas id="console-timeline-canvas" style="width: 100%; height: 100%; cursor: crosshair;"></canvas>

                            <div id="audio-timeline-tooltip" style="position: absolute; top: 10px; left: 15px; background: rgba(10,10,12,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: bold; white-space: nowrap; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10;"></div>
                        </div>
                    </div>
                    <div style="width: 75px; padding: 10px 8px; display: flex; flex-direction: column; gap: 5px; border-left: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.2); justify-content: center;">
                        <div style="display:flex; align-items:center; gap:6px;">

                            <span style="color: #ff3366; font-size: 8px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; opacity: 0.8;">Bass</span>

                            <div style="width:6px; height:6px; border-radius:1px; background:var(--accent); box-shadow: 0 0 5px rgba(0,242,255,0.3);"></div>
                            <span style="color: var(--accent); font-size: 8px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; opacity: 0.8;">Mid</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <div style="width:6px; height:6px; border-radius:1px; background:#ffaa00; box-shadow: 0 0 5px rgba(255,170,0,0.3);"></div>
                            <span style="color: #ffaa00; font-size: 8px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; opacity: 0.8;">High</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <div style="width:6px; height:6px; border-radius:1px; background:rgba(255,255,255,0.3);"></div>
                            <span style="color: rgba(255,255,255,0.3); font-size: 8px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase;">Flux</span>
                        </div>
                    </div>
                </div>
                <!-- PRESET HUD INTEGRATED INTO TIMELINE CONTAINER -->
                <div id="universal-hud" class="universal-hud" style="margin:0; border:none; background:rgba(0,0,0,0.2); padding:5px 15px; box-shadow:none; border-top:1px solid rgba(255,255,255,0.05); min-height: 25px; display: flex; align-items: center;">
                    <div id="hud-presets" class="hud-presets" style="margin:0; font-size:10px; display:flex; gap:5px; flex-wrap:wrap;"></div>
                </div>
            </div>
        </details>

        <!-- TOP BAR (CLEANED UP HEADER) -->
        <div class="console-header" style="padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05);">
            <div id="hud-vibe-log" class="hud-vibe-log" style="margin:0; border:none; background:none; padding:0; box-shadow:none; font-size:10px; opacity:0.8; flex: 1;"></div>
        </div>

        <!-- CAMERA FEED ABOVE GRID -->
        <div id="live-console-feed-container" style="display:none; padding:10px; background: #000; border-bottom: 1px solid var(--border); flex-shrink: 0;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <div style="font-size:10px; font-weight:800; color:var(--accent);">● LIVE FEED</div>
                <button class="btn btn-sm" onclick="toggleLiveConsoleFeed(false)">✕ CLOSE FEED</button>
            </div>
            <img id="live-console-feed-img" style="width:100%; border-radius:8px; display:block;" src="">
        </div>

        <div id="live-console-grid">
            <!-- Buttons will be injected here -->
        </div>

        <!-- 3. SLIDER SETUP (Live Override) -->
        <details class="engine-accordion" style="margin: 0; border:none; border-top:1px solid rgba(255,255,255,0.1); border-radius:0; flex-shrink: 0;" ontoggle="if(this.open) { renderSliderSetup(); this.scrollIntoView({behavior:'smooth'}); } else { window.scrollTo({top:0, behavior:'smooth'}); }">
            <summary style="height: 10px; min-height: 10px; padding: 0; cursor:pointer; list-style:none; display:flex; justify-content:center; align-items:center; background: rgba(255,255,255,0.02);">
                <div style="width: 30px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 1px;"></div>
            </summary>
            <div class="accordion-content" style="background:rgba(0,0,0,0.2); padding: 8px;">
                <!-- Fixture Picker -->
                <div id="pres-slider-setup-picker" style="display:flex; flex-wrap:nowrap; gap:8px; margin-bottom:10px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px;">
                    <!-- Fixture pills injected here -->
                </div>

                <!-- Strips Container -->
                <div id="pres-slider-setup-strips" style="display:flex; gap:10px; overflow-x:auto; padding:10px 0; min-height:160px; scrollbar-width: thin; scrollbar-color: var(--accent) transparent;">
                    <!-- Sliders injected here -->
                </div>

                <div style="display:flex; justify-content:space-between; margin-top:15px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.05);">
                    <button class="btn btn-sm" onclick="clearSliderSetup()" style="font-size:10px; opacity:0.6; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">CLEAR ALL OVERRIDES</button>
                    <!-- Hide Capture button in Console as there's no active preset editor context -->
                    <button class="btn btn-primary btn-sm" onclick="recordSliderSetup()" id="pres-slider-record-btn" style="display:none; font-size:10px;">CAPTURE</button>
                </div>

                <option value="knob">Knob (Rotary)</option>
                <option value="live_feed">Live Feed Toggle</option>
                <option value="blackout">Blackout</option>
            </select>

            <div id="assign-preset-wrap" style="display:none; margin-top:15px;">

                <select id="assign-preset-id" style="width:100%; background:rgba(0,0,0,0.3); color:#fff; border:1px solid #333; padding:8px; border-radius:8px; margin-top:5px;"></select>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:8px;">
                        <div><label>Min</label><input type="number" id="assign-min" value="0" style="width:100%; background:rgba(0,0,0,0.3); color:#fff; border:1px solid #333; padding:8px; border-radius:8px;"></div>
                        <div><label>Max</label><input type="number" id="assign-max" value="255" style="width:100%; background:rgba(0,0,0,0.3); color:#fff; border:1px solid #333; padding:8px; border-radius:8px;"></div>

                <!-- CHANNEL X (Horizontal - Optional) -->

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:8px;">
                        <div><label>Min</label><input type="number" id="assign-min-x" value="0" style="width:100%; background:rgba(0,0,0,0.3); color:#fff; border:1px solid #333; padding:8px; border-radius:8px;"></div>
                        <div><label>Max</label><input type="number" id="assign-max-x" value="255" style="width:100%; background:rgba(0,0,0,0.3); color:#fff; border:1px solid #333; padding:8px; border-radius:8px;"></div>

            <label style="margin-top:15px; display:block;">Button Color</label>

                <button class="color-swatch" onclick="setAssignColor('#7c4dff')" style="background:#7c4dff; width:30px; height:30px; border-radius:4px; cursor:pointer; border:2px solid transparent;"></button>
                <button class="color-swatch" onclick="setAssignColor('#00ffcc')" style="background:#00ffcc; width:30px; height:30px; border-radius:4px; cursor:pointer; border:2px solid transparent;"></button>
                <button class="color-swatch" onclick="setAssignColor('#ff4757')" style="background:#ff4757; width:30px; height:30px; border-radius:4px; cursor:pointer; border:2px solid transparent;"></button>
                <button class="color-swatch" onclick="setAssignColor('#2ed573')" style="background:#2ed573; width:30px; height:30px; border-radius:4px; cursor:pointer; border:2px solid transparent;"></button>
                <button class="color-swatch" onclick="setAssignColor('#ffa502')" style="background:#ffa502; width:30px; height:30px; border-radius:4px; cursor:pointer; border:2px solid transparent;"></button>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                <button class="btn" onclick="closeAssignment()">Cancel</button>
                <button class="btn btn-primary" onclick="saveAssignment()">Save</button>
            </div>
        </div>
    </div>

    <script src="shared_setup.js"></script>
    <script src="profile_logic.js"></script>
    <script src="live_controller.js"></script>
    <script>
        // Mirror Manager Background Logic
        let currentBgUrl = '';
        function connectLiveDashboard() {
            if (window.ws && (window.ws.readyState === WebSocket.CONNECTING || window.ws.readyState === WebSocket.OPEN)) return;

            const wsProtocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            const savedPort = localStorage.getItem('vj_ws_port') || '8765';
            const wsUrl = window.isOriginalCloud ? `${wsProtocol}://wss.ravebox.love` : 
                          ((window.isCustomTunnel) ? `${wsProtocol}://${window.wsHost}` : 
                          `${wsProtocol}://${window.host || location.hostname}:${savedPort}`);
            
            const ws = new WebSocket(wsUrl);
            ws.binaryType = 'arraybuffer';
            window.ws = ws;

            ws.onmessage = (e) => {
                if (e.data instanceof ArrayBuffer) {
                    window.lastBinaryData = e.data;
                    return;
                }
                
                try {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'audio_state' || msg.type === 'state') {
                        window.latestAudioState = msg;
                        
                        // Sync manual overrides set
                        if (msg.overrides && Array.isArray(msg.overrides)) {
                            window.latestOverrides = new Set(msg.overrides.map(a => parseInt(a)));
                        }

                        const sp = msg.spotify;
                        if (sp && sp.image_high && sp.image_high !== currentBgUrl) {
                            currentBgUrl = sp.image_high;
                            document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)), url('${currentBgUrl}')`;
                        } else if (!sp && currentBgUrl !== '') {
                            currentBgUrl = '';
                            document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('/public/background.png')`;
                        }
                        if (typeof window.updateUniversalHUD === 'function') window.updateUniversalHUD();
                        
                        // Refresh UI if we are in a tab that needs it
                        // Visual updates handled by updateLiveConsoleVisuals in the 50ms loop
                    }
                } catch (err) {}
            };

            // High-frequency UI update loop for EQ and DMX
            setInterval(() => {
                if (!window.lastBinaryData) return;
                const view = new DataView(window.lastBinaryData);
                
                // Layout: dmx starts at offset 86 (univ[0] at byte 86, univ[1] at byte 87, etc.)
                for (let i = 1; i <= 512; i++) {
                    window.latestDmxUniverse[i] = view.getUint8(86 + i);
                }

                // Layout Sync: latestAudioState must be updated from binary for timeline
                window.latestAudioState.flux = view.getFloat32(4, true);
                window.latestAudioState.bass = view.getFloat32(8, true);
                window.latestAudioState.mid = view.getFloat32(12, true);
                window.latestAudioState.high = view.getFloat32(16, true);
                window.latestAudioState.vol = view.getFloat32(20, true);
                window.latestAudioState.bpm = view.getFloat32(24, true);
                window.latestAudioState.beat = view.getUint8(56) === 1;

                // Timeline is now handled by startConsoleTimelineLoop via the canvas
                // Update Live Console Buttons & Sliders
                if (typeof window.updateLiveConsoleVisuals === "function") window.updateLiveConsoleVisuals();
                if (typeof window.updateSliderSetupVisuals === "function") window.updateSliderSetupVisuals();
            }, 50); // 20fps for smooth bars
        }
        
        function initConsole() {
            if (typeof loadLiveConfig === 'function') loadLiveConfig();
            if (typeof renderLiveTab === 'function') renderLiveTab();
            if (typeof startConsoleTimelineLoop === 'function') startConsoleTimelineLoop();
            connectLiveDashboard();
        }

        if (window.RAVEBOX_READY) {
            initConsole();
        } else {
            window.addEventListener('RAVEBOX_READY', initConsole);
        }

        // Dynamic Sizing Logic
        const originalRender = window.renderLiveTab;
        window.renderLiveTab = function() {
            if (typeof originalRender === 'function') originalRender();
            else if (typeof window.renderLiveTabActual === 'function') window.renderLiveTabActual();
            const container = document.getElementById('console-main-container');
            if (!container) return;

            const grid = document.getElementById('live-console-grid');
            const btns = grid.querySelectorAll('.live-btn');
            
            let maxIdx = -1;
            btns.forEach((btn, i) => {
                const cfg = liveConfig[i];
                if (cfg && cfg.type !== 'none') maxIdx = i;
            });

            if (window.liveEditMode) maxIdx = Math.max(maxIdx, 15);

            const rowCount = Math.ceil((maxIdx + 1) / 4);
            const colCount = Math.min(4, maxIdx + 1);

            // Mobile: Skip dynamic sizing, let CSS handle it
            if (window.innerWidth <= 600) {
                container.style.maxWidth = '';
                container.style.width = '';
                container.style.minWidth = '';
                return;
            }

            // Adjust width based on columns used (though we usually have 4 cols)
            // But let's adjust max-width based on how "full" it is
            if (maxIdx < 4) {
                container.style.maxWidth = '350px';
            } else if (maxIdx < 8) {
                container.style.maxWidth = '500px';
            } else {
                container.style.maxWidth = '800px';
            }

            // Adjust height implicitly via content, but we can add a class if it's "full screen"
            if (maxIdx >= 11) {
                container.style.borderRadius = '24px';
                container.style.width = '95%';
            } else {
                container.style.width = 'auto';
                container.style.minWidth = '320px';
            }
        };
    </script>
</body>
</html>
